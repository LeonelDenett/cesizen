# =============================================================================
# CESIZen - Docker Compose : Base de données pour tests E2E
# =============================================================================
# Ce fichier ne contient QUE la base de données PostgreSQL.
# L'application Next.js tourne en local avec "npm run dev".
# 
# Usage :
#   1. Démarrer la base : docker compose -f docker-compose.e2e.yml up -d
#   2. Lancer le script : npm run test:e2e:env
# =============================================================================

services:
  db-test:
    image: postgres:16-alpine
    container_name: cesizen-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cesizen_test
    ports:
      - "127.0.0.1:5479:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cesizen_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata-test:
    driver: local
