# =============================================================================
# CESIZen - Docker Compose : Tests E2E / Recette
# =============================================================================
# Entorno aislado para ejecutar tests E2E con Playwright.
# Usage :
#   docker compose -f docker-compose.e2e.yml up -d
#   npm run test:e2e
# =============================================================================

services:
  db-test:
    image: postgres:16-alpine
    container_name: cesizen-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cesizen_test
    ports:
      - "127.0.0.1:5479:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    networks:
      - cesizen-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cesizen_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@db-test:5432/cesizen_test
        NEXTAUTH_SECRET: test-secret-key-for-e2e-only
        NEXTAUTH_URL: http://localhost:3000
    container_name: cesizen-app-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db-test:5432/cesizen_test
      NEXTAUTH_SECRET: test-secret-key-for-e2e-only
      NEXTAUTH_URL: http://localhost:3000
      SECRETS_DB_PATH: /secrets/secrets.db
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - cesizen-test
    volumes:
      - secrets-data-test:/secrets
    command: ["sh", "-c", "npx drizzle-kit migrate && npx tsx lib/db/seed.ts && npm run start"]

volumes:
  pgdata-test:
    driver: local
  secrets-data-test:
    driver: local

networks:
  cesizen-test:
    driver: bridge
