name: CI - Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  install:
    name: Installation des dépendances
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

  lint:
    name: Vérification du code
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Lint du code
        run: npm run lint

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests
        run: npm run test

  build-frontend:
    name: Build du frontend
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'application
        run: npm run build

  build-docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: |
          docker build -t cesizen:${{ github.sha }} .

      - name: Vérification de l'image
        run: |
          docker images | grep cesizen

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    needs: build-frontend
    continue-on-error: true
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Installation des navigateurs
        run: npx playwright install --with-deps

      - name: Lancement des tests E2E
        run: npm run test:e2e