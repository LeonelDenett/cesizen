# =============================================================================
# CESIZen - Pipeline CI/CD (GitHub Actions)
# =============================================================================
# Fichier : .github/workflows/ci.yml
# Objectif : À chaque push sur main/develop (ou PR),
#            GitHub Actions exécute automatiquement :
#
#            Lint → Tests unitaires → Build → Scan sécurité
#            → Docker build → Tests E2E → Déploiement (si tout OK)
#
# Déclenchement :
#   - Push sur les branches main ou develop
#   - Pull Request vers main ou develop
#   - Manuel (bouton "Run workflow" dans GitHub)
# =============================================================================

name: CI/CD - CESIZen

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Permet d'exécuter manuellement depuis l'onglet Actions

# Si plusieurs push se suivent, annule le précédent pour ne pas gaspiller les minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # ÉTAPE 1 : LINT — Vérifier la qualité du code
  # ============================================================================
  lint:
    name: 🔍 Lint & qualité du code
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution du linter
        run: npm run lint

  # ============================================================================
  # ÉTAPE 2 : TESTS UNITAIRES — Jest
  # ============================================================================
  test-unit:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests unitaires avec seuil de couverture
        run: npm run test -- --coverage --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":70,"statements":70}}'

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        if: always()

  # ============================================================================
  # ÉTAPE 3 : BUILD — Compiler l'application Next.js (mode standalone)
  # ============================================================================
  build:
    name: 🏗️ Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesizen
          NEXTAUTH_SECRET: build-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Archivage du build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            package.json
            package-lock.json
            drizzle
            drizzle.config.ts
            lib/db
            public
            next.config.ts
          retention-days: 1

  # ============================================================================
  # ÉTAPE 4 : SCAN DE SÉCURITÉ — Vérifier les vulnérabilités
  # ============================================================================
  security-scan:
    name: 🛡️ Scan de sécurité
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Audit npm (vulnérabilités)
        run: npm audit --audit-level=high || true

      - name: Scan Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload des résultats Trivy
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
        if: always()

  # ============================================================================
  # ÉTAPE 5 : DOCKER BUILD — Construire l'image Docker
  # ============================================================================
  docker-build:
    name: 🐳 Build image Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image (avec cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # En CI on construit seulement, on pousse plus tard
          load: true   # Charge l'image dans le daemon Docker local pour vérification
          tags: |
            cesizen:latest
            cesizen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@db:5432/cesizen
            NEXTAUTH_SECRET=build-placeholder
            NEXTAUTH_URL=http://localhost:3000

      - name: Vérification de l'image construite
        run: docker images | grep cesizen || echo "Image construite mais non listée (buildx cache) — normal"

  # ============================================================================
  # ÉTAPE 6 : TESTS E2E — Playwright (tests avec navigateur)
  # ============================================================================
  e2e:
    name: 🎭 Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesizen
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5477:5432
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Configuration des variables d'environnement
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5477/cesizen" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=ci-secret-key-min-32-characters-long-string" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3333" >> $GITHUB_ENV

      - name: Build de l'application pour E2E
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5477/cesizen
          NEXTAUTH_SECRET: ci-secret-key-min-32-characters-long-string
          NEXTAUTH_URL: http://localhost:3333

      - name: Exécution des migrations
        run: npx drizzle-kit migrate

      - name: Exécution du seed
        run: npx tsx lib/db/seed.ts

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Lancement des tests E2E
        run: npx playwright test

      - name: Upload du rapport Playwright
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
        if: always()

  # ============================================================================
  # ÉTAPE 7 : DÉPLOIEMENT — Seulement si tout le reste a fonctionné
  # ============================================================================
  # Ce job est la "porte finale". Il attend :
  #   needs: [lint, test-unit, build, e2e]
  #     → Que ces 4 jobs terminent avec succès.
  #   if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
  #     → S'exécute uniquement sur la branche "main" ou si déclenchement manuel.
  # ============================================================================
  deploy-demo:
    name: 🚀 Déploiement démo (GHCR)
    runs-on: ubuntu-latest
    needs: [lint, test-unit, build, e2e]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Noms de registre en minuscules
        run: |
          echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/cesizen:latest
            ghcr.io/${{ env.OWNER_LOWER }}/cesizen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@db:5432/cesizen
            NEXTAUTH_SECRET=build-placeholder
            NEXTAUTH_URL=http://localhost:3000

      - name: Résumé du déploiement
        run: |
          echo "## 📦 Image poussée avec succès" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry** : ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**    : \`ghcr.io/${{ env.OWNER_LOWER }}/cesizen:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag latest** : \`ghcr.io/${{ env.OWNER_LOWER }}/cesizen:latest\`" >> $GITHUB_STEP_SUMMARY
