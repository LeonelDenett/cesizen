# =============================================================================
# CESIZen - Pipeline CI/CD (GitHub Actions)
# =============================================================================
# Archivo : .github/workflows/ci.yml
# Qué hace  : Cada vez que subís código a main/develop (o hacés un PR),
#             GitHub Actions ejecuta automáticamente este "plan" de pasos:
#
#             Lint → Test unitarios → Build → Scan seguridad
#             → Docker build → Test E2E → Deploy (solo si todo OK)
#
# Déclenchement (cuándo corre):
#   - Push a las ramas main o develop
#   - Pull Request hacia main o develop
#   - Manual (botón "Run workflow" en GitHub)
# =============================================================================

name: CI/CD - CESIZen

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Permite ejecutar manualmente desde la pestaña "Actions"

# Si se hacen varios push seguidos, cancela el anterior para no desperdiciar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # PASO 1 : LINT — Verificar calidad del código
  # ============================================================================
  lint:
    name: 🔍 Lint & qualité du code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution du linter
        run: npm run lint

  # ============================================================================
  # PASO 2 : TESTS UNITAIRES — Jest
  # ============================================================================
  test-unit:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests unitaires
        run: npm run test -- --coverage

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        if: always()

  # ============================================================================
  # PASO 3 : BUILD — Compilar la aplicación Next.js (modo standalone)
  # ============================================================================
  build:
    name: 🏗️ Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesizen
          NEXTAUTH_SECRET: build-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Archivage du build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            package.json
            package-lock.json
            drizzle
            drizzle.config.ts
            lib/db
            public
            next.config.ts
          retention-days: 1

  # ============================================================================
  # PASO 4 : SCAN DE SÉCURITÉ — Vérifier vulnérabilités
  # ============================================================================
  security-scan:
    name: 🛡️ Scan de sécurité
    runs-on: ubuntu-latest
    needs: [lint, build]  # Necesita que Lint y Build hayan terminado
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Audit npm (vulnérabilités)
        run: npm audit --audit-level=high || true

      - name: Scan Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload des résultats Trivy
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
        if: always()

  # ============================================================================
  # PASO 5 : DOCKER BUILD — Construir la imagen Docker
  # ============================================================================
  docker-build:
    name: 🐳 Build image Docker
    runs-on: ubuntu-latest
    needs: build  # Necesita que el Build haya terminado
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image (avec cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # En CI solo construimos, no empujamos todavía
          load: true   # Charge l'image dans le daemon Docker local pour vérification
          tags: |
            cesizen:latest
            cesizen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@db:5432/cesizen
            NEXTAUTH_SECRET=build-placeholder
            NEXTAUTH_URL=http://localhost:3000

      - name: Vérification de l'image construite
        run: docker images | grep cesizen || echo "Image construite mais non listée (buildx cache) — normal"

  # ============================================================================
  # PASO 6 : TESTS E2E — Playwright (tests con navegador real)
  # ============================================================================
  e2e:
    name: 🎭 Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test-unit]  # Besoin du code propre et des tests OK
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesizen
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5477:5432
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Configuration des variables d'environnement
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5477/cesizen" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=ci-secret-key-min-32-characters-long-string" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3333" >> $GITHUB_ENV

      - name: Build de l'application pour E2E
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5477/cesizen
          NEXTAUTH_SECRET: ci-secret-key-min-32-characters-long-string
          NEXTAUTH_URL: http://localhost:3333

      - name: Exécution des migrations
        run: npx drizzle-kit migrate

      - name: Exécution du seed
        run: npx tsx lib/db/seed.ts

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Lancement des tests E2E
        run: npm run test:e2e

      - name: Upload du rapport Playwright
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
        if: always()

  # ============================================================================
  # PASO 7 : DÉPLOIEMENT — Solo si TODO lo anterior funcionó
  # ============================================================================
  # Este job es la "puerta final". Usa:
  #   needs: [lint, test-unit, build, e2e]
  #     → Espera que esos 4 jobs terminen EXITOSAMENTE.
  #   if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
  #     → Solo se ejecuta si estamos en la rama "main" o si se disparó manualmente.
  # ============================================================================
  deploy-demo:
    name: 🚀 Déploiement démo (GHCR)
    runs-on: ubuntu-latest
    needs: [lint, test-unit, build, e2e]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cesizen:latest
            ghcr.io/${{ github.repository_owner }}/cesizen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@db:5432/cesizen
            NEXTAUTH_SECRET=build-placeholder
            NEXTAUTH_URL=http://localhost:3000

      - name: Résumé du déploiement
        run: |
          echo "## 📦 Image poussée avec succès" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry** : ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**    : \`ghcr.io/${{ github.repository_owner }}/cesizen:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag latest** : \`ghcr.io/${{ github.repository_owner }}/cesizen:latest\`" >> $GITHUB_STEP_SUMMARY
