# ============================================================
# SonarCloud Configuration — CESIZen
# ============================================================
# Project: https://sonarcloud.io/dashboard?id=LeonelDenett_cesizen

sonar.projectKey=LeonelDenett_cesizen
sonar.organization=leoneldenett

# Displayed in SonarCloud UI
sonar.projectName=cesizen
sonar.projectVersion=1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source code to analyze
sonar.sources=.

# Exclusions — do not analyze these
sonar.exclusions=\
  node_modules/**, \
  .next/**, \
  drizzle/**, \
  scripts/**, \
  playwright-report/**, \
  test-results/**, \
  **/*.test.ts, \
  **/*.test.tsx, \
  **/*.spec.ts, \
  **/*.spec.tsx, \
  lib/db/schema/**

# Test inclusions
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts, **/*.test.tsx, **/*.spec.ts, **/*.spec.tsx

# Coverage report (generated by Jest with --coverage)
sonar.typescript.lcov.reportPaths=coverage/lcov.info
